<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lcchema.cc</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #333333;
      min-height: 100vh;
      padding: 2.5rem 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #333333;
    }
    header p {
      margin-top: 0.35rem;
      font-size: 0.82rem;
      color: #999;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      max-width: 760px;
      margin: 0 auto;
    }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

    .panel {
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      padding: 1.25rem 1.4rem;
      background: #fff;
    }
    .panel.digest { border-top: 3px solid #5b9bd5; background: #f4f9ff; }
    .panel.report  { border-top: 3px solid #5cb87a; background: #f8fefb; }

    .panel h2 {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.9rem;
    }
    .digest h2 { color: #5b9bd5; }
    .report  h2 { color: #5cb87a; }

    .item {
      padding: 0.5rem 0;
      border-bottom: 1px solid #e8e8e8;
    }
    .item:last-child { border-bottom: none; }

    .item a.date-link {
      font-size: 0.88rem;
      font-weight: 500;
      text-decoration: none;
      display: block;
    }
    .digest .item a.date-link { color: #3a7fc1; }
    .digest .item a.date-link:hover { color: #2563a8; text-decoration: underline; }
    .report  .item a.date-link { color: #3aab6a; }
    .report  .item a.date-link:hover { color: #228b50; text-decoration: underline; }

    .item-links {
      margin-top: 0.15rem;
      display: flex;
      gap: 0.75rem;
    }
    .item-links a {
      font-size: 0.78rem;
      text-decoration: none;
    }
    .report .item-links a { color: #3aab6a; opacity: 0.8; }
    .report .item-links a:hover { opacity: 1; text-decoration: underline; }

    .status { font-size: 0.82rem; color: #aaa; padding: 0.3rem 0; }

    footer {
      text-align: center;
      margin-top: 2.5rem;
      font-size: 0.72rem;
      color: #bbb;
    }
  </style>
</head>
<body>

<header>
  <h1>lcchema.cc</h1>
  <p id="updated">Loading…</p>
</header>

<div class="grid">
  <div class="panel digest">
    <h2>Daily Digest</h2>
    <div id="digest-list"><p class="status">Loading…</p></div>
  </div>
  <div class="panel report">
    <h2>Weekly Report</h2>
    <div id="report-list"><p class="status">Loading…</p></div>
  </div>
</div>

<footer>lcchema.cc &mdash; internal</footer>

<script>
  const DIGEST_URL = "https://raw.githubusercontent.com/lcchang224/hema-onc-digest/main/manifests/latest.json";
  const REPORT_URL = "https://raw.githubusercontent.com/lcchang224/hematology-uptodate/main/manifests/latest.json";

  function relativeTime(isoStr) {
    const diff = Date.now() - new Date(isoStr).getTime();
    const h = Math.floor(diff / 36e5);
    if (h < 1)  return "just now";
    if (h < 24) return `${h}h ago`;
    return `${Math.floor(h / 24)}d ago`;
  }

  async function loadDigest() {
    const el = document.getElementById("digest-list");
    try {
      const data = await fetch(DIGEST_URL).then(r => r.json());
      el.innerHTML = data.items.map(item => `
        <div class="item">
          <a class="date-link" href="${item.url}" target="_blank">${item.date}</a>
        </div>`).join("");
      return data.generated;
    } catch {
      el.innerHTML = `<p class="status">Failed to load.</p>`;
    }
  }

  async function loadReport() {
    const el = document.getElementById("report-list");
    try {
      const data = await fetch(REPORT_URL).then(r => r.json());
      el.innerHTML = data.weeks.map(w => `
        <div class="item">
          <div class="date-link" style="font-size:0.88rem;font-weight:500;color:#333;margin-bottom:0.15rem;">${w.week}</div>
          <div class="item-links">
            <a href="${w.benign_url}"    target="_blank">Benign &#8594;</a>
            <a href="${w.malignant_url}" target="_blank">Malignant &#8594;</a>
          </div>
        </div>`).join("");
      return data.generated;
    } catch {
      el.innerHTML = `<p class="status">Failed to load.</p>`;
    }
  }

  Promise.all([loadDigest(), loadReport()]).then(([dGen, rGen]) => {
    const latest = [dGen, rGen].filter(Boolean).sort().at(-1);
    document.getElementById("updated").textContent = latest
      ? `Updated ${relativeTime(latest)}`
      : "lcchema.cc";
  });
</script>

</body>
</html>
