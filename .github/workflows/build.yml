name: Build hub

on:
  schedule:
    - cron: '0 23 * * *'   # 23:00 UTC daily = 07:00 Taipei (safety net)
  repository_dispatch:
    types: [digest-published, report-published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install httpx

      - name: Build hub
        run: python build_hub.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          git diff --cached --quiet || git commit -m "hub: rebuild $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
